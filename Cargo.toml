[workspace]
members = ["sdk"]
default-members = [".", "sdk"]
exclude = ["examples/attiny"]

[package]
name = "virtmach"
version = "0.2.1"
edition = "2024"
authors = ["Sascha Klick"]

[lib]
name = "virtmach"
crate-type = ["lib"]
path = "src/lib.rs"

[features]
default = []
std = ["dep:bytes"]
alloc = []
compile = ["std", "csv", "dep:num-literal-traits", "int_math_full"]
basic = ["compile", "dep:pest", "dep:pest_derive"]
i8 = []
i16 = []
i32 = []
int_math_pow = []
int_math_sqr = []
int_math_random = []
int_math_trig = []
int_math_full = ["int_math_pow", "int_math_sqr", "int_math_random", "int_math_trig"]

[dependencies]
cfg_block = "0.2.0"
log = { version = "0.4.27"  }
bytes = { version = "1.10.1", default-features = false, optional = true }
num-literal-traits = { version = "0.1.3", optional = true }
csv = { version = "1.4.0", optional = true }
pest = { version = "2.8", optional = true }
pest_derive = { version = "2.8", optional = true }

[dev-dependencies]
bitmap_writer = { version = "0.1.2", features = ["std"] }
sdl2 = { version = "0.38.0", features= ["ttf"] }
rustix = "=1.1.4"


